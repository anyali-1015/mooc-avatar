<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- LibreOffice headless 在 macOS 上用自带的 fontconfig，默认看不到系统字体，中文会整段丢失。
     这里把系统字体目录加进来，并把 Windows 常见中文字体映射到 macOS 自带的字体。 -->
<fontconfig>
  <dir>/System/Library/Fonts</dir>
  <dir>/System/Library/Fonts/Supplemental</dir>
  <dir>/Library/Fonts</dir>
  <dir prefix="xdg">fonts</dir>
  <dir>~/Library/Fonts</dir>
  <dir>/Applications/LibreOffice.app/Contents/Resources/fonts/truetype</dir>
  <cachedir prefix="xdg">mooc-fontconfig</cachedir>

  <alias><family>sans-serif</family><prefer><family>Hiragino Sans GB</family><family>STHeiti</family><family>Arial Unicode MS</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Songti SC</family><family>STSong</family><family>Arial Unicode MS</family></prefer></alias>

  <alias binding="same"><family>微软雅黑</family><prefer><family>Hiragino Sans GB</family></prefer></alias>
  <alias binding="same"><family>Microsoft YaHei</family><prefer><family>Hiragino Sans GB</family></prefer></alias>
  <alias binding="same"><family>等线</family><prefer><family>Hiragino Sans GB</family></prefer></alias>
  <alias binding="same"><family>DengXian</family><prefer><family>Hiragino Sans GB</family></prefer></alias>
  <alias binding="same"><family>黑体</family><prefer><family>STHeiti</family></prefer></alias>
  <alias binding="same"><family>SimHei</family><prefer><family>STHeiti</family></prefer></alias>
  <alias binding="same"><family>宋体</family><prefer><family>Songti SC</family></prefer></alias>
  <alias binding="same"><family>SimSun</family><prefer><family>Songti SC</family></prefer></alias>
  <alias binding="same"><family>仿宋</family><prefer><family>STFangsong</family><family>Songti SC</family></prefer></alias>
  <alias binding="same"><family>FangSong</family><prefer><family>STFangsong</family><family>Songti SC</family></prefer></alias>
  <alias binding="same"><family>楷体</family><prefer><family>Kaiti SC</family><family>STKaiti</family></prefer></alias>
  <alias binding="same"><family>KaiTi</family><prefer><family>Kaiti SC</family><family>STKaiti</family></prefer></alias>
</fontconfig>
